name: omega-pr

on:
  push:
    branches: [develop]
    paths:
      - 'components/omega/**'

  pull_request:
    branches: [develop]
    paths:
      - 'components/omega/**'

  workflow_dispatch:

env:
  CANCEL_OTHERS: false
  PATHS_IGNORE: '["**/README.md", "**/doc/**"]'

jobs:
  build:
    if: ${{ github.repository == 'E3SM-Project/E3SM' }} or \
        ${{ github.repository == 'E3SM-Project/Omega' }}
    name: lint and test docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up pixi Environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: components/omega/pixi.toml
          activate-environment: true

      - name: List Installed Packages
        run: |
          pixi list --manifest-path components/omega/pixi.toml

      - name: Check that dev-conda.txt matches pixi.toml
        run: |
          components/omega/utils/check_dev_envs.py

      - id: file_changes
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: ' '

      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --files ${{ steps.file_changes.outputs.files}}

      - name: Build Sphinx Docs
        run: |
          cd components/omega/doc
          make html-strict
