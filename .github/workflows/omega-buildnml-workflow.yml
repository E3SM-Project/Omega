name: omega-buildnml

on:
  push:
    branches: [develop]
    paths:
      - 'components/omega/cime_config/**'
      - '!components/omega/cime_config/*.xml'
      - 'components/omega/configs/Default.yml'
      - 'components/omega/pixi.toml'
      - '.github/workflows/omega-buildnml-workflow.yml'

  pull_request:
    branches: [develop]
    paths:
      - 'components/omega/cime_config/**'
      - '!components/omega/cime_config/*.xml'
      - 'components/omega/configs/Default.yml'
      - 'components/omega/pixi.toml'
      - '.github/workflows/omega-buildnml-workflow.yml'

  workflow_dispatch:

concurrency:
  # Cancel in progress runs testing the same git ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    if: ${{ github.repository == 'E3SM-Project/E3SM' ||
            github.repository == 'E3SM-Project/Omega' }}
    name: validate configuration files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pixi Environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: components/omega/pixi.toml
          activate-environment: true

      - name: List Installed Packages
        run: |
          pixi list --manifest-path components/omega/pixi.toml

      - name: Validate Omega configuration files
        run: |
          cd components/omega/cime_config
          ./validate_config.py

  unit-tests:
    if: ${{ github.repository == 'E3SM-Project/E3SM' ||
            github.repository == 'E3SM-Project/Omega' }}
    name: unit tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pixi environments for each Python version CIME supports
        environment: [py39, py310, py311, py312, py313, py314]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pixi Environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          manifest-path: components/omega/pixi.toml
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}

      - name: List Installed Packages
        run: |
          pixi list --manifest-path components/omega/pixi.toml -e ${{ matrix.environment }}

      - name: Run omega_buildnml unit tests
        run: |
          cd components/omega/cime_config
          python -m pytest omega_buildnml/tests -v
