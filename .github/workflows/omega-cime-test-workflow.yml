name: omega-cime-test

# Runs CIME system tests (ERS, PEM, PET) of Omega in a small G case (T62_oQU240.GOMEGA-NYF)
# in the E3SM container images (github.com/E3SM-Project/containers), on GitHub-hosted
# runners, using the images' own CIME machine (e3sm-container). These catch coupling,
# restart, decomposition and threading problems early; targeted tests on production
# machines are still up to authors and reviewers.

on:
  push:
    branches: [develop]
    paths:
      - 'components/omega/**'
      - '!components/omega/doc/**'
      - '.github/workflows/omega-cime-test-workflow.yml'

  pull_request:
    # Defaults plus ready_for_review, so drafts are tested once marked ready
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]
    paths:
      - 'components/omega/**'
      - '!components/omega/doc/**'
      - '.github/workflows/omega-cime-test-workflow.yml'

  workflow_dispatch:

concurrency:
  # Cancel in progress runs testing the same git ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Inputdata depends only on the grid and compset, so download it once and share it
  # with the test jobs through the Actions cache
  cache-inputdata:
    if: ${{ !github.event.pull_request.draft &&
            (github.repository == 'E3SM-Project/E3SM' ||
             github.repository == 'E3SM-Project/Omega') }}
    name: inputdata (${{ matrix.grid_compset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        grid_compset: [T62_oQU240.GOMEGA-NYF]
    env:
      IMAGE: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
    steps:
      # Bump the key's version to refresh the cache; the remaining steps run only on a miss
      - name: Check for cached inputdata
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: inputdata
          key: omega-inputdata-${{ matrix.grid_compset }}-v1
          lookup-only: true

      - name: Free disk space
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout Code Repository
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only cime, as nothing is built here
      - name: Update submodules
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init --depth 1 cime

      - name: Pull the image
        if: steps.lookup.outputs.cache-hit != 'true'
        run: docker pull "$IMAGE"

      - name: Download inputdata
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          mkdir -p inputdata scratch
          sudo chown -R 1000:1000 . inputdata scratch
          rc=0
          docker run --rm \
            -v "$PWD:/projects/e3sm/work/Omega" \
            -v "$PWD/inputdata:/projects/e3sm/data/inputdata" \
            -v "$PWD/scratch:/home/e3sm/e3sm_scratch" \
            "$IMAGE" bash -l /projects/e3sm/work/Omega/components/omega/ci/get-inputdata.sh \
            "${{ matrix.grid_compset }}" \
            || rc=$?
          sudo chown -R "$(id -u):$(id -g)" . inputdata scratch
          exit "$rc"

      - name: Save inputdata to the cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: inputdata
          key: omega-inputdata-${{ matrix.grid_compset }}-v1

  cime-test:
    # Run even if priming failed; the tests then download their own inputdata
    needs: cache-inputdata
    if: ${{ !cancelled() && !github.event.pull_request.draft &&
            (github.repository == 'E3SM-Project/E3SM' ||
             github.repository == 'E3SM-Project/Omega') }}
    name: ${{ matrix.test }}.${{ matrix.grid_compset }} (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One test per job, so each gets a whole runner and fails on its own. NYF forcing
      # is a single year, so the case needs < 1 GB of inputdata.
      matrix:
        env: [gnu13-openmpi4, intel2024-openmpi4]
        test: [ERS_D_Ln5, PEM_D_Ln5, PET_D_Ln5]
        grid_compset: [T62_oQU240.GOMEGA-NYF]
    env:
      IMAGE: ghcr.io/e3sm-project/e3sm-image:${{ matrix.env }}
    steps:
      # Hosted runners start with ~20 GB free; the image, the submodules and a case build
      # need more. These are preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the submodules a G case with Omega needs; several use git@ URLs, rewritten
      # to https for this command only.
      - name: Update submodules
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init --recursive --depth 1 \
            cime \
            externals/YAKL \
            externals/ekat \
            externals/mct \
            externals/scorpio \
            components/mpas-seaice/src/icepack \
            components/omega/external

      # Saved by cache-inputdata; anything missing is downloaded by the test
      - name: Restore cached inputdata
        uses: actions/cache/restore@v6
        with:
          path: inputdata
          key: omega-inputdata-${{ matrix.grid_compset }}-v1

      # The published images are public; no login needed
      - name: Pull the image
        run: docker pull "$IMAGE"

      # As the image's default user (uid 1000). The runner's own uid is 1001, so hand it
      # what the test writes to, and take it back after for the logs.
      - name: Run CIME test
        run: |
          mkdir -p inputdata scratch
          sudo chown -R 1000:1000 . inputdata scratch
          rc=0
          docker run --rm --shm-size=1g \
            -v "$PWD:/projects/e3sm/work/Omega" \
            -v "$PWD/inputdata:/projects/e3sm/data/inputdata" \
            -v "$PWD/scratch:/home/e3sm/e3sm_scratch" \
            "$IMAGE" bash -l /projects/e3sm/work/Omega/components/omega/ci/omega-cime-test.sh \
            "${{ matrix.test }}.${{ matrix.grid_compset }}" \
            || rc=$?
          sudo chown -R "$(id -u):$(id -g)" . inputdata scratch
          exit "$rc"

      # Into the job log rather than an artifact, so nothing is stored beyond the run's
      # logs. CIME gzips most of them, hence zcat -f.
      - name: Show logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in scratch/*.omega-ci/TestStatus.log \
                   scratch/*.omega-ci/bld/*.bldlog.* \
                   scratch/*.omega-ci/run/*.log.* \
                   scratch/*.omega-ci/run/case2run/*.log.*; do
            echo "::group::$f"
            zcat -f "$f"
            echo "::endgroup::"
          done
