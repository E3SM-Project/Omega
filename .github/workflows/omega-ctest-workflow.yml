name: omega-ctest

# Builds Omega standalone and runs its CTests in the E3SM container images
# (github.com/E3SM-Project/containers), on GitHub-hosted runners. The images carry the
# compilers, MPI, I/O libraries, Metis/ParMETIS and their own CIME machine (e3sm-container).
# The containers repo runs the same build weekly against Omega develop (omega-case.yaml).

on:
  push:
    branches: [develop]
    paths:
      - 'components/omega/**'
      - '!components/omega/doc/**'
      - '.github/workflows/omega-ctest-workflow.yml'

  pull_request:
    branches: [develop]
    paths:
      - 'components/omega/**'
      - '!components/omega/doc/**'
      - '.github/workflows/omega-ctest-workflow.yml'

  workflow_dispatch:

concurrency:
  # Cancel in progress runs testing the same git ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ctest:
    if: ${{ github.repository == 'E3SM-Project/E3SM' ||
            github.repository == 'E3SM-Project/Omega' }}
    name: ${{ matrix.env }}, ${{ matrix.build_type }}
    # x86_64 only: on aarch64 the standalone build picks up x86's -mcmodel=medium from the
    # CIME macros and fails to configure (E3SM-Project/Omega#610).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        env: [gnu13-openmpi4, intel2024-openmpi4]
        build_type: [Release, Debug]
    env:
      IMAGE: ghcr.io/e3sm-project/e3sm-image:${{ matrix.env }}
    steps:
      # Hosted runners start with ~20 GB free; the image, Omega's submodules and a build
      # need more. These are preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Only the submodules a standalone build needs (doc/devGuide/CMakeBuild.md); several
      # use git@ URLs, rewritten to https for this command only.
      - name: Update submodules
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init --recursive --depth 1 \
            externals/YAKL \
            externals/ekat \
            externals/scorpio \
            components/omega/external \
            cime

      - name: Download meshes
        run: components/omega/ci/get-meshes.sh omega-meshes

      # The published images are public; no login needed
      - name: Pull the image
        run: docker pull "$IMAGE"

      # As the image's default user (uid 1000). The runner's own uid is 1001, so hand it
      # what the build writes to, and take it back after for the logs. ctest exits non-zero
      # if any test fails, which fails this step.
      - name: Build Omega and run CTests
        run: |
          mkdir -p omega-build
          sudo chown -R 1000:1000 . omega-build
          rc=0
          docker run --rm --shm-size=1g \
            -e OMEGA_BUILD_TYPE=${{ matrix.build_type }} \
            -v "$PWD:/projects/e3sm/work/Omega" \
            -v "$PWD/omega-meshes:/projects/e3sm/data/omega-meshes:ro" \
            -v "$PWD/omega-build:/home/e3sm/omega-build" \
            "$IMAGE" bash -l /projects/e3sm/work/Omega/components/omega/ci/omega-ctest.sh \
            || rc=$?
          sudo chown -R "$(id -u):$(id -g)" . omega-build
          exit "$rc"

      # Into the job log rather than an artifact, so nothing is stored beyond the run's logs
      - name: Show logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in omega-build/e3smcase/*.log* \
                   omega-build/Testing/Temporary/LastTest*.log \
                   omega-build/test/logs/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
